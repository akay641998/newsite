name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: newsite

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure insecure registry
        run: |
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries": ["${{ secrets.OPENSHIFT_REGISTRY }}"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5

      - name: Log in to OpenShift Registry
        run: |
          echo "${{ secrets.OPENSHIFT_TOKEN }}" | docker login \
            ${{ secrets.OPENSHIFT_REGISTRY }} \
            --username unused \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.OPENSHIFT_REGISTRY }}/default/$IMAGE_NAME:latest \
            -t ${{ secrets.OPENSHIFT_REGISTRY }}/default/$IMAGE_NAME:${{ github.sha }} .

      - name: Push to OpenShift Registry
        run: |
          docker push ${{ secrets.OPENSHIFT_REGISTRY }}/default/$IMAGE_NAME:latest
          docker push ${{ secrets.OPENSHIFT_REGISTRY }}/default/$IMAGE_NAME:${{ github.sha }}
